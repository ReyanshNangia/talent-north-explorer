    <script>
      // Prevent Lovable preview URLs from being indexed; keep custom domain indexable.
      (function () {
        var hostname = window.location.hostname;
        if (hostname.includes('.lovable.app') || hostname.includes('lovableproject.com')) {
          var robots = document.querySelector('meta[name="robots"]');
          if (!robots) {
            robots = document.createElement('meta');
            robots.name = 'robots';
            document.head.appendChild(robots);
          }
          robots.content = 'noindex, nofollow';

          var googlebot = document.querySelector('meta[name="googlebot"]');
          if (!googlebot) {
            googlebot = document.createElement('meta');
            googlebot.name = 'googlebot';
            document.head.appendChild(googlebot);
          }
          googlebot.content = 'noindex, nofollow';
        }
      })();
    </script>
